name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Skills repository
        shell: pwsh
        run: ./scripts/Test-Repository.ps1
